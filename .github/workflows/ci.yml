name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint and type-check Python
        run: ruff check . && ruff format --check . && mypy
      - name: Test Python with coverage
        run: pytest
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Lint web
        working-directory: web
        run: npm run lint
      - name: Test web data helpers
        working-directory: web
        run: node --test src/analytics.test.js
      - name: Build web
        working-directory: web
        run: npm run build
